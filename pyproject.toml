# Tool settings only: the app is built from ewpe_keepalive/Dockerfile, not installed
# as a package.

[tool.ruff]
target-version = "py311"  # the oldest supported Python (standalone runs, CI); the image runs 3.14
line-length = 88  # as Home Assistant core; `ruff format` wraps the code
src = ["ewpe_keepalive", "tests", "tools"]  # where the tests import from (tests/helpers.py)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = [
  "E501",  # line length: the formatter wraps code; long strings and URLs may stay
  "PLR2004",  # protocol codes, ports and limits are numbers
]

[tool.ruff.lint.per-file-ignores]
# The test helpers take how long to wait for a reply; for some, no reply in time is
# the result (None, False), not a cancellation.
"tests/*" = ["ASYNC109"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
